<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creature sprite sheet (dev)</title>
  <style>
    body { margin: 0; padding: 16px; background: #1b2434; color: #cbd5e1; font: 13px sans-serif; }
    h2 { margin: 14px 0 6px; font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    .cell { background: #2f4a2c; padding: 4px; text-align: center; }
    canvas { image-rendering: pixelated; display: block; }
  </style>
</head>
<body>
  <h2>Random species (frame 0 / frame 1)</h2>
  <div id="random" class="row"></div>
  <h2>Each part variant on a neutral base</h2>
  <div id="parts"></div>
  <script type="module">
    import { SeededRNG } from '/src/cosmos/seed.js';
    import { setActiveRng } from '/src/simulation/random.js';
    import { Genome, PART_COUNTS, recombine } from '/src/life/genome.js';
    import { getCreatureCanvas, getVehicleCanvas } from '/src/art/creatureSprite.js';
    import { UNITS } from '/src/civilization/military.js';

    const SCALE = 6;
    const seed = new URLSearchParams(location.search).get('seed') || 'sheet';
    setActiveRng(new SeededRNG(seed));

    function show(parent, traits, frames = [0, 1]) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      for (const frame of frames) {
        const source = getCreatureCanvas(traits, frame);
        const canvas = document.createElement('canvas');
        canvas.width = source.width * SCALE;
        canvas.height = source.height * SCALE;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
        cell.appendChild(canvas);
      }
      cell.style.display = 'flex';
      cell.style.gap = '4px';
      parent.appendChild(cell);
    }

    // armies: every unit class at rest and attacking, then the machines (idle and firing)
    {
      const human = Genome.pure({ body: 5, head: 6, legs: 1, ears: 0, tail: 0, horns: 0, wings: 0, pattern: 0, hue: 0.07, sat: 0.6, light: 0.5, hue2: 0.3, eyeHue: 0.6 }).phenotype();
      const war = document.createElement('div');
      war.className = 'row';
      document.getElementById('random').before(war);
      for (const [id, u] of Object.entries(UNITS)) {
        if (u.kind !== 'foot') continue;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.display = 'flex'; cell.style.gap = '2px'; cell.title = u.name;
        for (const anim of [null, u.anim]) {
          const src = getCreatureCanvas(human, 0, { clanColor: '#38bdf8', unit: id, anim });
          const c = document.createElement('canvas'); c.width = src.width * 5; c.height = src.height * 5;
          const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
          cell.appendChild(c);
        }
        war.appendChild(cell);
      }
      const machines = document.createElement('div');
      machines.className = 'row';
      document.getElementById('random').before(machines);
      for (const [id, u] of Object.entries(UNITS)) {
        if (u.kind === 'foot') continue;
        const cell = document.createElement('div');
        cell.className = 'cell'; cell.style.display = 'flex'; cell.style.gap = '4px'; cell.title = u.name;
        for (const anim of [null, 'fire']) {
          const src = getVehicleCanvas(u.gear, '#38bdf8', anim);
          const c = document.createElement('canvas'); c.width = src.width * 4; c.height = src.height * 4;
          const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
          cell.appendChild(c);
        }
        machines.appendChild(cell);
      }
    }
    // the founding body plans: people, fish folk, and hybrids of two kinds (a child takes each part from either parent)
    const mk = parts => Genome.pure({ ...parts, hue: 0.08, sat: 0.6, light: 0.5, hue2: 0.3, eyeHue: 0.6 });
    const kinds = {
      human: mk({ body: 5, head: 6, legs: 1, ears: 0, tail: 0, horns: 0, wings: 0, pattern: 0 }),
      elf: mk({ body: 5, head: 7, legs: 1, ears: 6, tail: 0, horns: 0, wings: 0, pattern: 1 }),
      beastfolk: mk({ body: 2, head: 8, legs: 1, ears: 5, tail: 6, horns: 0, wings: 0, pattern: 2 }),
      dragonkin: mk({ body: 5, head: 11, legs: 1, ears: 0, tail: 4, horns: 2, wings: 0, pattern: 3 }),
      fishfolk: mk({ body: 6, head: 10, legs: 6, ears: 0, tail: 5, horns: 0, wings: 0, pattern: 0 }),
      wolf: mk({ body: 0, head: 1, legs: 0, ears: 1, tail: 1, horns: 0, wings: 0, pattern: 0 }),
      dwarf: mk({ body: 9, head: 12, legs: 1, ears: 0, tail: 0, horns: 0, wings: 0, pattern: 0 }),
      orc: mk({ body: 2, head: 13, legs: 1, ears: 8, tail: 0, horns: 0, wings: 0, pattern: 0 }),
      goblin: mk({ body: 5, head: 19, legs: 1, ears: 8, tail: 0, horns: 0, wings: 0, pattern: 0 }),
      mage: mk({ body: 10, head: 11, legs: 1, ears: 6, tail: 0, horns: 0, wings: 0, pattern: 0 }),
      angel: mk({ body: 5, head: 6, legs: 1, ears: 0, tail: 0, horns: 0, wings: 7, pattern: 0 }),
      deer: mk({ body: 1, head: 14, legs: 7, ears: 5, tail: 1, horns: 5, wings: 0, pattern: 2 }),
      rabbit: mk({ body: 0, head: 15, legs: 2, ears: 7, tail: 1, horns: 0, wings: 0, pattern: 0 }),
      bear: mk({ body: 2, head: 16, legs: 2, ears: 2, tail: 1, horns: 0, wings: 0, pattern: 0 }),
      beetle: mk({ body: 8, head: 17, legs: 8, ears: 0, tail: 0, horns: 4, wings: 6, pattern: 0 }),
      grey: mk({ body: 12, head: 18, legs: 7, ears: 0, tail: 0, horns: 0, wings: 0, pattern: 1 }),
      scorpion: mk({ body: 11, head: 17, legs: 8, ears: 0, tail: 8, horns: 0, wings: 0, pattern: 0 }),
      ramfolk: mk({ body: 2, head: 7, legs: 4, ears: 5, tail: 7, horns: 7, wings: 0, pattern: 0 })
    };
    const alien = n => Genome.pure({ body: 4, head: 0, legs: 2, ears: 0, tail: 1, horns: 0, wings: 0, pattern: 0, mutation: n, hue: 0.4, sat: 0.6, light: 0.5, hue2: 0.7, eyeHue: 0.9 });
    const mutantsRow = document.createElement('div');
    mutantsRow.className = 'row';
    document.getElementById('random').before(mutantsRow);
    for (let n = 1; n < 8; n++) show(mutantsRow, alien(n).phenotype());
    const peopleRow = document.createElement('div');
    peopleRow.className = 'row';
    document.getElementById('random').before(peopleRow);
    for (const g of Object.values(kinds)) show(peopleRow, g.phenotype());
    const hybrids = document.createElement('div');
    hybrids.className = 'row';
    document.getElementById('random').before(hybrids);
    const names = Object.keys(kinds);
    for (let i = 0; i < 14; i++) show(hybrids, recombine(kinds[names[i % names.length]], kinds[names[(i + 1 + (i >> 1)) % names.length]]).phenotype());
    for (let i = 0; i < 24; i++) show(document.getElementById('random'), Genome.random().phenotype());

    const base = Genome.pure({ body: 0, head: 0, legs: 1, ears: 0, tail: 0, horns: 0, wings: 0, pattern: 0, hue: 0.08, sat: 0.7, light: 0.5, hue2: 0.3, eyeHue: 0.6 }).phenotype();
    for (const gene of Object.keys(PART_COUNTS)) {
      const title = document.createElement('h2');
      title.textContent = gene;
      document.getElementById('parts').appendChild(title);
      const row = document.createElement('div');
      row.className = 'row';
      document.getElementById('parts').appendChild(row);
      for (let v = 0; v < PART_COUNTS[gene]; v++) show(row, { ...base, [gene]: v }, [0]);
    }
    document.title = 'ready';
  </script>
</body>
</html>
